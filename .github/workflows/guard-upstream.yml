name: Guard upstream

on:
  pull_request:
  push:
    branches: [main]

jobs:
  owned-paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Check we did not patch cloudflare-os
        run: bash scripts/check-owned-paths.sh
