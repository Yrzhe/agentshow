name: deploy

# 只在 push 到 main 时触发。
# 刻意不加 pull_request —— fork 来的 PR 一旦能跑这个 workflow，就拿到了部署用的 token。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同时只跑一个部署，后来的取消前面的，避免两次 deploy 互相覆盖。
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentshow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agentshow/package-lock.json

      - run: npm ci

      # typecheck 自己先跑 wrangler types —— worker-configuration.d.ts 不进仓库，
      # 干净检出里没有它，Env 会缺掉所有绑定。
      - name: 类型检查
        run: npm run typecheck

      # npm test 是包着核对的 vitest：它会断言磁盘上每个测试文件都真的跑了。
      # 只看退出码不够 —— 少跑一半文件时 vitest 也是 0。
      #
      # 要凭证是因为 wrangler.jsonc 声明了 ai 绑定：AI 绑定只有远程资源，
      # vitest-pool-workers 于是要起一条远程代理会话，没有 token 就起不来，
      # 11 个 workers 测试文件全部拿不到运行时。本地能跑只是因为 wrangler
      # 已经登录过。这个 workflow 只在 push 到 main 时触发、不接 fork 的 PR，
      # 所以这里的信任级别和下面部署那一步是同一个。
      - name: 测试
        run: npm test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 构建
        run: npx vite build

      # 用 vite 插件生成的解析后配置，路径和 assets 目录都由它算好。
      - name: 部署到 Cloudflare
        run: npx wrangler deploy --config dist/agentshow/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
